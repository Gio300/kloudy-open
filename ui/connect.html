<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Kloudy</title>
<style>
/* CONNECT_PICKER_CSS */
:root{font:16px/1.5 system-ui,sans-serif;color:#34353a;background:#fff;color-scheme:light;--line:#e2e2e8;--muted:#656770;--brand:#34353a;--action:#33343a;--action-ink:#fff}*{box-sizing:border-box}body{margin:0;padding:22px;max-width:640px}header{display:flex;align-items:center;gap:12px}.orb{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 38% 35%,#cefaff 0,#9171ff 25%,#7431df 65%,#4b238b);box-shadow:0 0 22px #9e6ef077;animation:alive 3s ease-in-out infinite}h1{color:inherit;font-size:24px;line-height:1.25;margin:0}p{margin:18px 0;color:var(--muted)}a,summary{color:inherit}a.button,button.button{display:block;border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-decoration:none;font-weight:600;min-height:48px}a.primary,button.primary{background:var(--action);color:var(--action-ink);border-color:var(--action)}details{margin-top:14px}summary{padding:10px 0;min-height:44px;cursor:pointer}details p{margin:8px 0}#status,#fallback{font-size:14px}#fallback{display:inline-flex;align-items:center;min-height:44px}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--brand);outline-offset:3px}@keyframes alive{50%{transform:scale(1.09);box-shadow:0 0 30px #9e6ef0aa}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;background:#292a34;color:#e7e7ec;--line:#34353f;--muted:#aaabb5;--brand:#dcebf8;--action:#e9e9ed;--action-ink:#202126}}@media(max-width:300px){body{padding:14px}h1{font-size:20px}}
.brand{font-size:30px;font-weight:600;letter-spacing:-1px;color:#fff;text-shadow:0 1px 1px #999,0 2px 4px #bbb}header{margin-bottom:20px}button.button{width:100%;font:inherit;text-align:left;cursor:pointer}#copy-fallback{width:100%;font:inherit;padding:12px;border:1px solid var(--line);background:transparent;color:inherit}</style></head><body>
<header><span class="orb" aria-hidden="true"></span><span class="brand" role="img" aria-label="Kloudy">Kloudy</span></header><h1 id="title">Kloudy. In your editor.</h1>
<p id="intro">Choose where to use Kloudy.</p>
<button class="button primary" id="copy-install" data-copy-kloudy>Connect</button><input id="copy-fallback" aria-label="Install command to copy" value="npx kloudy" readonly hidden><a class="button primary" data-connect href="https://kloudy.ai/install#discover" target="_blank" rel="noopener noreferrer" hidden>Find tools ↗</a>
<details><summary>More</summary><p>Public tool search needs no account. Opening setup does not connect private tools.</p></details>
<p id="status" role="status" aria-live="polite"></p><a id="fallback" hidden target="_blank" rel="noopener noreferrer"></a>
<!-- CONNECT_SCRIPT -->
</body></html>
